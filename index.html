<style>
/* Layout: app a una colonna per il telefono, barra in alto e schede in basso; colori dei gruppi muscolari presi dai dischi olimpici */
:root{
  --bg:#EEF0EE; --surface:#FFFFFF; --sunk:#E2E5E3; --fg:#17191C; --muted:#5B6168; --line:#D3D7D5;
  --accent:#17191C; --on-accent:#FFFFFF; --machine:#BCC2C6; --far:#A2A8AE;
  --red:#D33A2C; --blue:#2465B8; --yellow:#C99200; --green:#2E8B4A; --white:#8A8F96; --violet:#7149B5; --teal:#13827E;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1B1E22; --sunk:#24282D; --fg:#EDEFF0; --muted:#A0A6AD; --line:#30353B;
  --accent:#EDEFF0; --on-accent:#121417; --machine:#454B52; --far:#666D75;
  --red:#F06A5C; --blue:#6EA3F0; --yellow:#F1C232; --green:#5CC07A; --white:#C9CDD2; --violet:#A98AE6; --teal:#4CC4BE;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1B1E22; --sunk:#24282D; --fg:#EDEFF0; --muted:#A0A6AD; --line:#30353B;
  --accent:#EDEFF0; --on-accent:#121417; --machine:#454B52; --far:#666D75;
  --red:#F06A5C; --blue:#6EA3F0; --yellow:#F1C232; --green:#5CC07A; --white:#C9CDD2; --violet:#A98AE6; --teal:#4CC4BE;
  color-scheme:dark}

html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.005em}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{white-space:nowrap;font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.plates{display:flex;gap:3px;align-items:center}
.plates i{display:block;width:6px;border-radius:2px}
.plates i:nth-child(1){height:22px;background:var(--red)}
.plates i:nth-child(2){height:18px;background:var(--blue)}
.plates i:nth-child(3){height:14px;background:var(--yellow)}
.plates i:nth-child(4){height:10px;background:var(--green)}
.back{text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--sunk);border-radius:999px;padding:6px 14px 6px 10px;font-weight:600;cursor:pointer}

main{padding-block:16px 120px}
.view{display:grid;gap:16px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);margin:0;max-width:62ch}

/* barra schede */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:10px 12px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13px}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--fg)}
nav.tabs a[aria-current="page"] svg{stroke-width:2.4}

/* ricerca e filtri */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 12px}
.search input{border:0;background:transparent;flex:1;padding:12px 0;font-size:16px;min-width:0}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--fg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

/* elenco esercizi */
.group-title{display:flex;align-items:center;gap:10px;margin-top:8px}
.group-title h2{font-size:22px;text-transform:uppercase}
.group-title .count{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.list{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:6px 1fr auto;gap:14px;align-items:center;background:var(--surface);padding:12px 14px 12px 0;text-decoration:none}
.row .bar{align-self:stretch;margin-block:-12px}
.row strong{display:block;font-weight:600;font-size:17px;line-height:1.25}
.row small{color:var(--muted);font-size:14px}
.row .chev{color:var(--muted)}
.row:hover{background:var(--sunk)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px;color:var(--muted);text-align:center}

/* scheda esercizio */
.ex-head{display:grid;gap:8px}
.ex-head h1{font-size:clamp(34px,8vw,48px);text-transform:uppercase}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;font-weight:600;border-radius:6px;padding:3px 9px;background:var(--sunk);display:inline-flex;align-items:center;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.card h2{font-size:22px;text-transform:uppercase}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:700;font-size:18px;width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center}
.errs{margin:0;padding-left:20px;display:grid;gap:6px}
.dose{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.dose div{background:var(--sunk);border-radius:8px;padding:10px 4px}
.dose b{display:block;font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.dose span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}

/* respirazione */
.breath{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.breath div{border-radius:8px;padding:12px;background:var(--sunk);display:grid;gap:4px}
.breath b{font-family:var(--display);font-size:20px;text-transform:uppercase}
.breath .in b{color:var(--blue)}
.breath .out b{color:var(--red)}
.breath p{margin:0;font-size:15px}
.note{margin:0;font-size:15px;color:var(--muted)}

/* video / guida animata */
.player{border-radius:var(--r);background:var(--sunk);padding:12px 14px 16px;display:grid;gap:6px;justify-items:center;text-align:center}
.player .ptop{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.player .tempo{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;text-align:left}
.stage{width:170px;height:170px;display:grid;place-items:center}
.pacer{width:170px;height:170px;border-radius:50%;background:var(--blue);opacity:.9;transform:scale(.55);transition-property:transform,background-color;transition-timing-function:ease-in-out}
.pacer.out{background:var(--red)}
.player .label b{display:block;font-family:var(--display);font-size:30px;text-transform:uppercase;line-height:1.1}
.player .label span{font-size:15px;color:var(--muted);display:block;min-height:3em;max-width:40ch}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:16px}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.small{padding:7px 14px;font-size:14px}
.btn.big{width:100%;padding:16px;font-size:18px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.mine{display:flex;gap:8px;flex-wrap:wrap}
.mine input{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--bg);font-size:15px}

/* sessioni */
.sessions{display:grid;gap:12px}
.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.sess-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sess h2{font-size:26px;text-transform:uppercase}
.sess .meta{display:flex;gap:14px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stack{display:flex;gap:3px;height:8px;border-radius:4px;overflow:hidden}
.stack i{flex:1}
.sess ol{margin:0;padding-left:20px;font-size:15px;color:var(--muted);display:grid;gap:2px}
.sess ol b{color:var(--fg);font-weight:600}
.sess .actions{display:flex;gap:8px;flex-wrap:wrap}

/* allenamento in corso */
.run{display:grid;gap:16px}
.progress{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--fg);transition:width .3s}
.run h1{font-size:clamp(36px,9vw,54px);text-transform:uppercase}
.setbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.setbox div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 4px;text-align:center}
.setbox b{display:block;font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.setbox span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.pips{display:flex;gap:6px}
.pips i{flex:1;height:10px;border-radius:5px;background:var(--sunk)}
.pips i.done{background:var(--green)}
.pips i.now{background:var(--fg)}
.rest{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:12px;justify-items:center;text-align:center}
.clock{font-family:var(--display);font-weight:800;font-size:96px;line-height:.9;font-variant-numeric:tabular-nums}
.remind{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:8px;padding:12px;font-size:15px}
.remind b{font-weight:600}
.next{color:var(--muted);font-size:15px}

/* diario */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.week i{height:36px;border-radius:6px;background:var(--sunk);display:block}
.week i.on{background:var(--green)}
.week i.today{outline:2px solid var(--fg);outline-offset:1px}
.log{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.log div{background:var(--surface);padding:12px 14px;display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.log span{color:var(--muted);font-size:14px;white-space:nowrap}
.fine{font-size:13px;color:var(--muted)}

/* sincronizzazione */
.sync{white-space:nowrap;margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;text-align:right}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok i{background:var(--green)}
.sync.slow i{background:var(--yellow)}

/* registrazione serie */
.logger{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:6px;text-align:center;min-width:0}
.stepper label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.stepper .ctl{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:4px}
.stepper button{width:40px;height:40px;border-radius:50%;border:0;background:var(--sunk);font-size:20px;font-weight:600;cursor:pointer}
.stepper input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-family:var(--display);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums;padding:0}
.stepper input:focus{outline:none;background:var(--sunk);border-radius:6px}
.prev{font-size:15px;color:var(--muted)}
.prev b{color:var(--fg);font-variant-numeric:tabular-nums}
.minor{display:flex;gap:8px;flex-wrap:wrap}
.banner{background:var(--accent);color:var(--on-accent);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner .btn{background:var(--on-accent);color:var(--accent)}
.banner .btn.ghost{background:transparent;color:var(--on-accent);border-color:var(--on-accent)}
.prs{display:grid;gap:6px;width:100%;text-align:left}
.prs div{display:flex;justify-content:space-between;gap:10px;background:var(--sunk);border-radius:8px;padding:10px 12px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stats div{background:var(--sunk);border-radius:8px;padding:10px 4px;text-align:center}
.stats b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}

/* progressi */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.hist{display:grid;gap:6px;font-size:15px}
.hist div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.hist span{color:var(--muted);white-space:nowrap}
.rec small{color:var(--muted);font-size:13px}

/* editor schede */
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input{border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:var(--surface);font-size:17px}
.items{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.item-top{display:flex;gap:8px;align-items:center}
.item-top strong{flex:1;min-width:0;font-weight:600}
.icon{width:34px;height:34px;border-radius:50%;border:0;background:var(--sunk);cursor:pointer;font-size:15px;flex:none}
.icon:disabled{opacity:.35;cursor:default}
.dosein{display:grid;grid-template-columns:1fr 1.4fr 1.3fr;gap:8px}
.dosein label{display:grid;gap:3px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.dosein input,.dosein select{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);font-size:16px;width:100%;min-width:0;text-transform:none;letter-spacing:0;color:var(--fg)}
.picker{display:grid;gap:10px}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:var(--surface);padding:11px 14px;cursor:pointer}
.pick:hover{background:var(--sunk)}
.pick small{color:var(--muted);margin-left:auto;font-size:13px}
.err{color:var(--red);font-weight:600;margin:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.w{background:var(--surface)}
details.w summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
details.w summary::-webkit-details-marker{display:none}
details.w summary span{color:var(--muted);font-size:14px;white-space:nowrap}
details.w .body{padding:0 14px 14px;display:grid;gap:6px;font-size:15px}
details.w .body p{margin:0}
details.w .body b{font-weight:600}
.log2{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

/* --- grafica v4 --- */
:root{--r:16px;--shadow:0 1px 2px rgba(23,25,28,.06),0 6px 20px rgba(23,25,28,.07)}

.row{grid-template-columns:44px minmax(0,1fr) auto;padding:10px 14px}
.ex-head{background:color-mix(in srgb,var(--c) 14%,var(--surface));border-radius:var(--r);padding:18px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}

.ex-head h1,.ex-head .tags{position:relative;max-width:calc(100% - 70px)}

.ring{position:relative;width:min(240px,70vw);aspect-ratio:1;max-width:100%}

.ring .track{fill:none;stroke:var(--sunk);stroke-width:12}

.sess .stack{height:10px;border-radius:5px}

textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px;resize:vertical}

 {id:'squat',name:'Squat',g:'gambe',e:'bilanciere',lv:'Intermedio',mu:'Cosce e glutei',hl:['thigh','glutes'],
  steps:['Bilanciere sulla parte alta della schiena, non sul collo.','Piedi larghi come le spalle, punte leggermente aperte.','Scendi portando il bacino indietro e in basso, ginocchia nella direzione delle punte.','Risali spingendo il pavimento, petto alto.'],
  br:{in:'In alto, prima di scendere: aria nella pancia e addome contratto.',out:'Dopo il punto più duro della risalita.'},tempo:[3,2],
  note:'Lavora nel rack con le sicure regolate appena sotto la profondità che raggiungi.',
  err:['Talloni che si staccano','Schiena che si arrotonda in basso','Ginocchia che vanno verso l\'interno'],dose:['4','6–8','2\'']},
 {id:'leg-extension',name:'Leg extension',g:'gambe',e:'macchina',lv:'Principiante',mu:'Quadricipiti',
  steps:['Ginocchio allineato al perno della macchina.','Rullo appoggiato sopra le caviglie.','Stendi le gambe fino in alto e tieni un attimo.','Scendi lentamente.'],
  br:{in:'Mentre scendi.',out:'Mentre stendi le gambe.'},tempo:[3,2],
  err:['Dare il colpo per alzare il peso','Staccare il sedere dal sedile'],dose:['3','12–15','60"']},
 {id:'leg-curl',name:'Leg curl',g:'gambe',e:'macchina',lv:'Principiante',mu:'Femorali',hl:['hams'],
  steps:['Sdraiato o seduto, ginocchio allineato al perno.','Rullo appena sopra i talloni.','Piega le gambe portando i talloni verso il sedere.','Torna lentamente.'],
  br:{in:'Mentre le gambe tornano distese.',out:'Mentre pieghi le gambe.'},tempo:[3,2],
  err:['Alzare il bacino','Movimento troppo veloce'],dose:['3','12','60"']},
 {id:'affondi',name:'Affondi',g:'gambe',e:'manubri',lv:'Principiante',mu:'Cosce e glutei',hl:['thigh','glutes'],
  steps:['In piedi, un manubrio per mano lungo i fianchi.','Fai un passo lungo in avanti.','Scendi finché il ginocchio dietro quasi tocca terra.','Spingi con la gamba davanti per tornare in piedi.'],
  br:{in:'Mentre scendi.',out:'Mentre torni su.'},tempo:[2,2],
  err:['Passo troppo corto','Busto che cade in avanti'],dose:['3','10 per gamba','90"']},
 {id:'polpacci',name:'Sollevamenti sulle punte',g:'gambe',e:'macchina',lv:'Principiante',mu:'Polpacci',hl:['calf'],
  steps:['Punte dei piedi sul bordo della pedana, talloni liberi.','Sali sulle punte il più in alto possibile.','Tieni un secondo in alto.','Scendi fino a sentire allungare il polpaccio.'],
  br:{in:'Mentre scendi.',out:'Mentre sali sulle punte.'},tempo:[2,2],
  err:['Rimbalzare in basso','Piegare le ginocchia'],dose:['3','15','45"']},

 {id:'shoulder-press',name:'Shoulder press',g:'spalle',e:'macchina',lv:'Principiante',mu:'Spalle e tricipiti',
  steps:['Sedile regolato con le maniglie all\'altezza delle spalle.','Schiena appoggiata, addome contratto.','Spingi verso l\'alto fino a braccia quasi tese.','Riscendi con controllo all\'altezza delle orecchie.'],
  br:{in:'Mentre scendi.',out:'Mentre spingi verso l\'alto.'},tempo:[3,2],
  err:['Inarcare troppo la schiena','Bloccare i gomiti'],dose:['3','10–12','90"']},
 {id:'alzate-laterali',name:'Alzate laterali',g:'spalle',e:'manubri',lv:'Principiante',mu:'Spalle (parte laterale)',
  steps:['In piedi, manubri leggeri lungo i fianchi.','Gomiti appena piegati.','Alza le braccia di lato fino all\'altezza delle spalle.','Scendi lentamente.'],
  br:{in:'Mentre abbassi.',out:'Mentre alzi.'},tempo:[3,2],
  err:['Usare pesi troppo pesanti e dondolare','Alzare le spalle verso le orecchie'],dose:['3','12–15','60"']},
 {id:'face-pull',name:'Tirate al viso',g:'spalle',e:'cavi',lv:'Principiante',mu:'Spalle posteriori',
  steps:['Corda sulla carrucola all\'altezza degli occhi.','Afferra la corda con i pollici verso di te.','Tira verso il viso aprendo le mani ai lati delle orecchie.','Torna avanti con controllo.'],
  br:{in:'Mentre torni avanti.',out:'Mentre tiri verso il viso.'},tempo:[2,2],
  err:['Tirare con la schiena','Gomiti troppo bassi'],dose:['3','15','60"']},

 {id:'curl-manubri',name:'Curl con manubri',g:'braccia',e:'manubri',lv:'Principiante',mu:'Bicipiti',
  steps:['In piedi, manubri lungo i fianchi, palmi in avanti.','Gomiti fermi vicino al corpo.','Piega le braccia portando i manubri verso le spalle.','Scendi lentamente fino a braccia distese.'],
  br:{in:'Mentre scendi.',out:'Mentre sali.'},tempo:[3,2],
  err:['Dondolare con la schiena','Gomiti che vanno in avanti'],dose:['3','10–12','60"']},
 {id:'pushdown',name:'Estensioni tricipiti ai cavi',g:'braccia',e:'cavi',lv:'Principiante',mu:'Tricipiti',
  steps:['Carrucola alta con corda o barra.','Gomiti attaccati ai fianchi.','Spingi verso il basso fino a braccia tese.','Risali lentamente fino a 90°.'],
  br:{in:'Mentre risali.',out:'Mentre spingi giù.'},tempo:[2,2],
  err:['Staccare i gomiti dal corpo','Piegarsi sopra la corda'],dose:['3','12','60"']},

 {id:'plank',name:'Plank',g:'core',e:'corpo',lv:'Principiante',mu:'Addome',
  steps:['Avambracci a terra, gomiti sotto le spalle.','Corpo in linea dalla testa ai talloni.','Contrai addome e glutei.','Tieni la posizione respirando con calma.'],
  br:{in:'Dal naso, lento, gonfiando i fianchi.',out:'Dalla bocca, lenta, senza mollare l\'addome.'},tempo:[4,4],
  note:'Non trattenere il fiato: respira in modo regolare per tutta la durata.',
  err:['Bacino troppo alto o troppo basso','Trattenere il respiro'],dose:['3','30–45"','45"']},
 {id:'crunch',name:'Crunch',g:'core',e:'corpo',lv:'Principiante',mu:'Addome',
  steps:['Sdraiato, ginocchia piegate, piedi a terra.','Mani dietro la testa senza tirare il collo.','Solleva le spalle da terra arrotolando la schiena.','Torna giù lentamente.'],
  br:{in:'Mentre torni giù.',out:'Mentre sali.'},tempo:[2,2],
  err:['Tirare la testa con le mani','Salire di slancio'],dose:['3','15','45"']},
 {id:'crunch-cavo',name:'Crunch ai cavi',g:'core',e:'cavi',lv:'Intermedio',mu:'Addome',
  steps:['In ginocchio davanti alla carrucola alta, corda vicino alla testa.','Fianchi fermi.','Arrotola il busto portando i gomiti verso le cosce.','Torna su con controllo.'],
  br:{in:'Mentre torni su.',out:'Mentre ti arrotoli verso il basso.'},tempo:[2,2],
  err:['Sedersi sui talloni','Tirare con le braccia'],dose:['3','12–15','60"']},

 {id:'tapis-roulant',name:'Tapis roulant',g:'cardio',e:'cardio',lv:'Tutti',mu:'Cuore e gambe',
  steps:['Parti camminando a 5 km/h per 3 minuti.','Aumenta fino a un ritmo in cui riesci ancora a parlare.','Per variare alza la pendenza invece della velocità.','Finisci con 3 minuti di camminata lenta.'],
  br:{in:'Dal naso per 2–3 passi.',out:'Dalla bocca per 2–3 passi.'},tempo:[3,3],
  err:['Tenersi ai corrimano','Guardare i piedi'],dose:['1','20–30\'','—']},
 {id:'cyclette',name:'Cyclette',g:'cardio',e:'cardio',lv:'Tutti',mu:'Cuore e gambe',
  steps:['Sellino all\'altezza dell\'anca quando sei in piedi accanto.','Con il pedale in basso il ginocchio resta appena piegato.','Pedala a 70–90 giri al minuto.','Alterna 1 minuto più forte e 2 minuti più tranquilli.'],
  br:{in:'Regolare, dal naso quando il ritmo è facile.',out:'Lunga e completa, senza fretta.'},tempo:[3,3],
  err:['Sellino troppo basso','Schiena curva sul manubrio'],dose:['1','20–30\'','—']},
 {id:'vogatore',name:'Vogatore',g:'cardio',e:'cardio',lv:'Tutti',mu:'Cuore, gambe e schiena',
  steps:['Piedi legati, ginocchia piegate, braccia tese.','Spingi prima con le gambe.','Poi inclina leggermente il busto indietro.','Infine tira la maniglia verso lo sterno. Torna nell\'ordine inverso.'],
  br:{in:'Mentre torni avanti.',out:'Durante la spinta delle gambe.'},tempo:[2,1],
  err:['Tirare con le braccia prima delle gambe','Schiena curva'],dose:['1','10–15\'','—']},
 {id:'panca-manubri',name:'Panca piana con manubri',g:'petto',e:'manubri',lv:'Principiante',mu:'Petto e tricipiti',
  steps:['Sdraiati sulla panca con un manubrio per mano appoggiato sulle cosce.','Porta i manubri sopra il petto, braccia tese, palmi verso i piedi.','Scendi piano aprendo i gomiti a circa 45° dal corpo, fino all\'altezza del petto.','Spingi in alto riavvicinando i manubri sopra il petto.'],
  br:{in:'Mentre scendi verso il petto.',out:'Mentre spingi in alto.'},tempo:[3,2],
  err:['Gomiti troppo aperti a 90°','Far rimbalzare i manubri sul petto','Inarcare troppo la schiena'],dose:['3','10–12','90"']},
 {id:'panca-inclinata-manubri',name:'Panca inclinata con manubri',g:'petto',e:'manubri',lv:'Principiante',mu:'Petto alto e spalle',
  steps:['Schienale inclinato a 30°, siediti con la schiena ben appoggiata.','Manubri all\'altezza delle spalle, palmi in avanti.','Spingi verso l\'alto fino a braccia quasi tese, sopra il mento.','Scendi lentamente fino all\'altezza del petto alto.'],
  br:{in:'Mentre scendi.',out:'Mentre spingi verso l\'alto.'},tempo:[3,2],
  err:['Schienale troppo alto (lavorano solo le spalle)','Staccare il sedere dalla panca'],dose:['3','10–12','90"']},
 {id:'pectoral-machine',name:'Pectoral machine',g:'petto',e:'macchina',lv:'Principiante',mu:'Petto',
  steps:['Regola il sedile: le maniglie all\'altezza del petto.','Schiena appoggiata, braccia aperte con i gomiti appena piegati.','Chiudi le braccia davanti al petto come per abbracciare un albero.','Riapri lentamente fino a sentire il petto che si allunga.'],
  br:{in:'Mentre riapri le braccia.',out:'Mentre chiudi davanti al petto.'},tempo:[3,2],
  err:['Aprire troppo dietro le spalle','Spingere con le mani invece che con il petto'],dose:['3','12–15','60"']},

 {id:'rematore-bilanciere',name:'Rematore con bilanciere',g:'schiena',e:'bilanciere',lv:'Intermedio',mu:'Dorsali e centro schiena',
  steps:['In piedi, ginocchia morbide, busto inclinato in avanti a circa 45° con la schiena dritta.','Bilanciere a braccia tese, presa poco più larga delle spalle.','Tira il bilanciere verso l\'ombelico stringendo le scapole.','Scendi controllando fino a braccia tese.'],
  br:{in:'Mentre il bilanciere scende.',out:'Mentre tiri verso la pancia.'},tempo:[2,2],
  err:['Schiena curva','Alzare il busto a ogni ripetizione','Tirare di slancio'],dose:['3','8–10','90"']},
 {id:'pullover-cavo',name:'Pullover ai cavi',g:'schiena',e:'cavi',lv:'Principiante',mu:'Dorsali',
  steps:['Carrucola alta con barra dritta o corda, fai un passo indietro.','Busto leggermente inclinato in avanti, braccia tese in alto.','Porta la barra verso le cosce tenendo le braccia quasi tese.','Risali lentamente fino all\'altezza della testa.'],
  br:{in:'Mentre risali.',out:'Mentre porti la barra verso le cosce.'},tempo:[2,2],
  err:['Piegare i gomiti trasformandolo in un pushdown','Muovere il busto avanti e indietro'],dose:['3','12–15','60"']},
 {id:'iperestensioni',name:'Hyperextension',g:'schiena',e:'macchina',lv:'Principiante',mu:'Lombari e glutei',
  steps:['Regola il cuscino all\'altezza dell\'anca, talloni bloccati sotto il rullo.','Braccia incrociate sul petto.','Scendi piegandoti in avanti con la schiena dritta.','Risali fino a formare una linea dritta con le gambe, senza andare oltre.'],
  br:{in:'Mentre scendi.',out:'Mentre risali.'},tempo:[2,2],
  err:['Salire troppo inarcando la schiena','Muoversi di slancio'],dose:['3','12–15','60"']},

 {id:'stacco-rumeno',name:'Stacco rumeno',g:'gambe',e:'bilanciere',lv:'Intermedio',mu:'Femorali e glutei',hl:['hams','glutes'],
  steps:['In piedi, bilanciere davanti alle cosce, piedi alla larghezza delle anche.','Ginocchia appena piegate e ferme.','Spingi il sedere indietro e scendi con il bilanciere vicino alle gambe, schiena dritta.','Quando senti tirare dietro le cosce, risali spingendo i fianchi in avanti.'],
  br:{in:'Mentre scendi.',out:'Mentre risali.'},tempo:[3,2],
  err:['Schiena curva','Bilanciere lontano dalle gambe','Piegare troppo le ginocchia'],dose:['3','8–10','120"']},
 {id:'hip-thrust',name:'Hip thrust',g:'gambe',e:'bilanciere',lv:'Intermedio',mu:'Glutei',hl:['glutes','hams'],
  steps:['Schiena alta appoggiata a una panca, bilanciere imbottito sulle anche.','Piedi a terra alla larghezza delle anche, ginocchia piegate.','Spingi i fianchi in alto fino a formare una linea spalle-ginocchia.','Stringi i glutei un secondo, poi scendi piano.'],
  br:{in:'Mentre scendi.',out:'Mentre spingi i fianchi in alto.'},tempo:[2,2],
  err:['Inarcare la schiena invece di stringere i glutei','Piedi troppo lontani'],dose:['3','10–12','90"']},
 {id:'goblet-squat',name:'Goblet squat',g:'gambe',e:'manubri',lv:'Principiante',mu:'Cosce e glutei',hl:['thigh','glutes'],
  steps:['Tieni un manubrio in verticale contro il petto, con due mani.','Piedi poco più larghi delle spalle, punte leggermente aperte.','Scendi come per sederti, petto alto e talloni a terra.','Risali spingendo con tutto il piede.'],
  br:{in:'Mentre scendi.',out:'Mentre risali.'},tempo:[3,2],
  err:['Talloni che si alzano','Ginocchia che cadono verso l\'interno'],dose:['3','10–12','90"']},
 {id:'abductor',name:'Abductor machine',g:'gambe',e:'macchina',lv:'Principiante',mu:'Glutei (esterno coscia)',
  steps:['Siediti con la schiena appoggiata e i cuscinetti all\'esterno delle ginocchia.','Parti con le gambe chiuse.','Apri le gambe spingendo verso l\'esterno.','Richiudi lentamente senza far sbattere i pesi.'],
  br:{in:'Mentre richiudi.',out:'Mentre apri le gambe.'},tempo:[2,2],
  err:['Muoversi di slancio','Staccare la schiena'],dose:['3','15','60"']},
 {id:'adductor',name:'Adductor machine',g:'gambe',e:'macchina',lv:'Principiante',mu:'Interno coscia',
  steps:['Siediti con la schiena appoggiata e i cuscinetti all\'interno delle ginocchia.','Parti con le gambe aperte quanto ti è comodo.','Chiudi le gambe stringendo verso il centro.','Riapri lentamente.'],
  br:{in:'Mentre riapri.',out:'Mentre chiudi le gambe.'},tempo:[2,2],
  err:['Aprire troppo all\'inizio','Far sbattere i pesi'],dose:['3','15','60"']},

 {id:'lento-manubri',name:'Lento avanti con manubri',g:'spalle',e:'manubri',lv:'Principiante',mu:'Spalle',
  steps:['Seduto su una panca con schienale dritto, manubri all\'altezza delle orecchie.','Palmi in avanti, gomiti sotto i polsi.','Spingi in alto fino a braccia quasi tese.','Scendi lentamente fino all\'altezza delle orecchie.'],
  br:{in:'Mentre scendi.',out:'Mentre spingi in alto.'},tempo:[3,2],
  err:['Inarcare la schiena','Scendere troppo poco'],dose:['3','10–12','90"']},
 {id:'alzate-frontali',name:'Alzate frontali',g:'spalle',e:'manubri',lv:'Principiante',mu:'Spalle (parte davanti)',
  steps:['In piedi, manubri davanti alle cosce.','Braccia tese con i gomiti appena morbidi.','Alza le braccia davanti a te fino all\'altezza delle spalle.','Scendi lentamente.'],
  br:{in:'Mentre scendi.',out:'Mentre sali.'},tempo:[3,2],
  err:['Dondolare con il busto','Salire sopra la testa'],dose:['3','12','60"']},
 {id:'reverse-fly',name:'Reverse fly alla macchina',g:'spalle',e:'macchina',lv:'Principiante',mu:'Spalle posteriori',
  steps:['Siediti rivolto verso lo schienale, petto appoggiato.','Afferra le maniglie davanti a te a braccia quasi tese.','Apri le braccia all\'indietro stringendo le scapole.','Torna avanti lentamente.'],
  br:{in:'Mentre torni avanti.',out:'Mentre apri le braccia.'},tempo:[2,2],
  err:['Usare peso troppo alto e tirare con la schiena','Piegare troppo i gomiti'],dose:['3','15','60"']},
 {id:'tirate-mento',name:'Tirate al mento',g:'spalle',e:'bilanciere',lv:'Intermedio',mu:'Spalle e trapezi',hl:['delt','traps'],
  steps:['In piedi, bilanciere davanti alle cosce, presa alla larghezza delle spalle.','Tira il bilanciere in alto vicino al corpo.','I gomiti salgono per primi, fino all\'altezza delle spalle.','Scendi lentamente.'],
  br:{in:'Mentre scendi.',out:'Mentre tiri in alto.'},tempo:[2,2],
  err:['Presa troppo stretta','Salire con i gomiti sopra le spalle se senti fastidio'],dose:['3','12','60"']},

 {id:'curl-bilanciere',name:'Curl con bilanciere',g:'braccia',e:'bilanciere',lv:'Principiante',mu:'Bicipiti',
  steps:['In piedi, bilanciere a braccia tese, palmi in avanti, presa alla larghezza delle spalle.','Gomiti fermi ai fianchi.','Piega le braccia portando il bilanciere verso il petto.','Scendi lentamente fino a braccia distese.'],
  br:{in:'Mentre scendi.',out:'Mentre sali.'},tempo:[3,2],
  err:['Dondolare con la schiena','Gomiti che si spostano in avanti','Scendere a metà'],dose:['3','10–12','60"']},
 {id:'curl-martello',name:'Curl a martello',g:'braccia',e:'manubri',lv:'Principiante',mu:'Bicipiti e avambracci',hl:['ua','fa'],
  steps:['In piedi, manubri lungo i fianchi con i palmi rivolti verso le gambe.','Gomiti fermi vicino al corpo.','Piega le braccia tenendo i palmi uno di fronte all\'altro, come un martello.','Scendi lentamente.'],
  br:{in:'Mentre scendi.',out:'Mentre sali.'},tempo:[3,2],
  err:['Ruotare i polsi','Dondolare con il busto'],dose:['3','10–12','60"']},
 {id:'curl-scott',name:'Curl alla panca Scott',g:'braccia',e:'macchina',lv:'Principiante',mu:'Bicipiti',
  steps:['Siediti con la parte dietro delle braccia ben appoggiata sul cuscino inclinato.','Afferra la barra o le maniglie, palmi verso l\'alto.','Piega le braccia portando la barra verso le spalle.','Scendi lentamente quasi fino a braccia tese.'],
  br:{in:'Mentre scendi.',out:'Mentre sali.'},tempo:[3,2],
  err:['Staccare i gomiti dal cuscino','Distendere di colpo in fondo'],dose:['3','10–12','60"']},
 {id:'curl-cavo',name:'Curl ai cavi',g:'braccia',e:'cavi',lv:'Principiante',mu:'Bicipiti',
  steps:['Carrucola bassa con barra, in piedi vicino alla macchina.','Gomiti fermi ai fianchi, palmi in avanti.','Piega le braccia portando la barra verso il petto.','Scendi lentamente: il cavo tiene il muscolo sempre in tensione.'],
  br:{in:'Mentre scendi.',out:'Mentre sali.'},tempo:[3,2],
  err:['Piegarsi in avanti','Gomiti che si staccano dai fianchi'],dose:['3','12','60"']},
 {id:'french-press',name:'French press',g:'braccia',e:'bilanciere',lv:'Intermedio',mu:'Tricipiti',
  steps:['Sdraiato sulla panca, bilanciere (meglio quello sagomato) a braccia tese sopra il petto.','Tieni le braccia ferme e leggermente inclinate verso la testa.','Piega solo i gomiti portando la barra verso la fronte.','Distendi le braccia tornando su.'],
  br:{in:'Mentre scendi verso la fronte.',out:'Mentre distendi le braccia.'},tempo:[3,2],
  err:['Aprire i gomiti verso l\'esterno','Muovere le spalle insieme ai gomiti'],dose:['3','10–12','90"']},
 {id:'estensioni-sopra-testa',name:'Estensioni sopra la testa',g:'braccia',e:'manubri',lv:'Principiante',mu:'Tricipiti',
  steps:['Seduto o in piedi, un manubrio tenuto con due mani sopra la testa.','Gomiti vicino alla testa, rivolti in avanti.','Piega i gomiti portando il manubrio dietro la nuca.','Distendi le braccia verso l\'alto.'],
  br:{in:'Mentre scendi dietro la testa.',out:'Mentre distendi verso l\'alto.'},tempo:[3,2],
  err:['Aprire i gomiti','Inarcare la schiena'],dose:['3','12','60"']},
 {id:'kickback',name:'Kickback con manubrio',g:'braccia',e:'manubri',lv:'Principiante',mu:'Tricipiti',
  steps:['Una mano e un ginocchio sulla panca, busto parallelo al pavimento.','Braccio vicino al fianco, gomito piegato a 90°.','Distendi il braccio all\'indietro fino a renderlo dritto.','Torna piano a 90° senza muovere il gomito.'],
  br:{in:'Mentre torni a 90°.',out:'Mentre distendi il braccio.'},tempo:[2,2],
  err:['Abbassare il gomito','Muovere il braccio di slancio'],dose:['3','12 per braccio','60"']},
 {id:'dip-macchina',name:'Dip machine',g:'braccia',e:'macchina',lv:'Principiante',mu:'Tricipiti e petto',
  steps:['Siediti con la schiena appoggiata, maniglie ai lati del corpo.','Gomiti piegati e rivolti indietro.','Spingi le maniglie in basso fino a braccia tese.','Risali lentamente fino a 90°.'],
  br:{in:'Mentre risali.',out:'Mentre spingi giù.'},tempo:[2,2],
  err:['Aprire i gomiti verso l\'esterno','Alzare le spalle verso le orecchie'],dose:['3','10–12','60"']},

 {id:'sollevamento-gambe',name:'Sollevamento gambe',g:'core',e:'corpo',lv:'Principiante',mu:'Addome basso',
  steps:['Sdraiato a terra, braccia lungo i fianchi, mani sotto i glutei se ti aiuta.','Gambe tese o leggermente piegate.','Alza le gambe fino a portarle in verticale.','Scendi lentamente senza toccare terra e senza inarcare la schiena.'],
  br:{in:'Mentre scendi.',out:'Mentre sali.'},tempo:[3,2],
  err:['Schiena che si stacca da terra','Scendere di colpo'],dose:['3','12','45"']},
 {id:'crunch-macchina',name:'Ab crunch machine',g:'core',e:'macchina',lv:'Principiante',mu:'Addome',

const L = {torso:52, ua:30, fa:28, th:40, sh:38, foot:12, head:10};
const dirv = a => { const r=a*Math.PI/180; return [Math.sin(r), -Math.cos(r)]; };
const add = (p,v,k) => [p[0]+v[0]*k, p[1]+v[1]*k];
function ik(S, T, l1, l2, bend){
  let dx=T[0]-S[0], dy=T[1]-S[1], d=Math.hypot(dx,dy)||0.001;
  const max=l1+l2-0.5; if(d>max){ T=[S[0]+dx/d*max, S[1]+dy/d*max]; dx=T[0]-S[0]; dy=T[1]-S[1]; d=max; }
  const a = Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))));
  const base = Math.atan2(dy,dx) + bend*a;
  return [[S[0]+Math.cos(base)*l1, S[1]+Math.sin(base)*l1], T];
}
function lerpPose(A,B,t){
  const o={};
  for(const k in A){ const a=A[k], b=(B[k]==null?a:B[k]);
    if(Array.isArray(a)) o[k]=[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
    else if(typeof a==='number') o[k]=a+(b-a)*t; else o[k]=a; }
  return o;
}
function solve(P, mirror){
  const hip=P.hip, td=dirv(P.torso);
  const sh = add(hip, td, L.torso);
  const head = add(sh, td, 15);
  const sw = mirror?16:0, hw = mirror?8:0;
  const shS = [sh[0]+sw, sh[1]], hipS=[hip[0]+hw, hip[1]];
  const hand = P.hand==='down' ? [shS[0]+3, shS[1]+56] : P.hand;
  const eb = P.eb!=null ? P.eb : 1, lb = P.lb!=null ? P.lb : -1;
  const [elbow, handR] = ik(shS, hand, L.ua, L.fa, mirror? -1 : eb);
  const [knee, ankle] = ik(hipS, P.foot, L.th, L.sh, mirror? 1 : lb);
  const toe = P.toe || [ankle[0]+12, ankle[1]+1];

/* --- dati: copia sul dispositivo + salvataggio privato sul tuo account --- */
const store = {
  get(k,d){try{const v=localStorage.getItem('pf-'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('pf-'+k,JSON.stringify(v))}catch(e){}},

};
const S = { routines: store.get('routines',[]), videos: store.get('video',{}), workouts: store.get('workouts',[]), body: store.get('body',{height:'',goal:'',age:'',entries:[]}) };
let DB=null, BASE='', sync='local';
const chains = {};
function serial(key, fn){ chains[key] = (chains[key]||Promise.resolve()).then(fn).catch(()=>{}); return chains[key]; }
const clone = o => JSON.parse(JSON.stringify(o));

function saveRoutines(){ store.set('routines',S.routines); if(DB){ const list=clone(S.routines); serial('routines',()=>DB.doc(BASE+'/routines').set({list})); } }
function saveVideos(){ store.set('video',S.videos); if(DB){ const map=clone(S.videos); serial('videos',()=>DB.doc(BASE+'/videos').set({map})); } }
function wcol(){ return DB.doc(BASE+'/log').collection('workouts'); }
function addWorkout(w){ S.workouts.unshift(w); store.set('workouts',S.workouts); if(DB) serial('w'+w.id,()=>wcol().doc(w.id).set(clone(w))); }
function deleteWorkout(id){ S.workouts=S.workouts.filter(w=>w.id!==id); store.set('workouts',S.workouts); if(DB) serial('w'+id,()=>wcol().doc(id).delete()); }

async function initDb(){
  if(!window.claude || typeof window.claude.use!=='function'){ sync='local'; return paintSync(); }
  sync='loading'; paintSync();
  let db=null, uid=null;
  try{ const r = await Promise.all([claude.use('db'), claude.use('user')]); db=r[0]; uid = r[1] ? await r[1].id() : null; }catch(e){}
  if(!db || !uid){ sync='local'; return paintSync(); }
  DB=db; BASE='data/users/'+uid;
  const seen = {};
  const timer = setTimeout(()=>{ if(sync==='loading'){ sync='slow'; paintSync(); } },10000);
  const confirmed = k => { seen[k]=1; if(seen.r&&seen.v&&seen.w&&seen.b){ clearTimeout(timer); sync='ok'; paintSync(); } };
  const fail = ()=>{ clearTimeout(timer); sync='slow'; paintSync(); };
  const localW = S.workouts.slice(), localR = S.routines.slice(), localV = Object.assign({},S.videos);
  db.doc(BASE+'/routines').onSnapshot(s=>{
    if(s.exists){ S.routines = clone(s.data().list||[]); store.set('routines',S.routines); }
    else if(!s.metadata.fromCache && localR.length){ S.routines=localR; saveRoutines(); }
    if(!s.metadata.fromCache) confirmed('r'); refresh();
  }, fail);
  db.doc(BASE+'/videos').onSnapshot(s=>{
    if(s.exists){ S.videos = clone(s.data().map||{}); store.set('video',S.videos); }
    else if(!s.metadata.fromCache && Object.keys(localV).length){ S.videos=localV; saveVideos(); }
    if(!s.metadata.fromCache) confirmed('v'); refresh();
  }, fail);
  const localB = clone(S.body);
  db.doc(BASE+'/body').onSnapshot(s=>{
    if(s.exists){ S.body = Object.assign({height:'',goal:'',age:'',entries:[]}, clone(s.data())); store.set('body',S.body); }
    else if(!s.metadata.fromCache && (localB.entries||[]).length+(localB.height?1:0)){ S.body=localB; saveBody(); }
    if(!s.metadata.fromCache) confirmed('b'); refresh();
  }, fail);
  let first = true;
  wcol().orderBy('at','desc').limit(1000).onSnapshot(q=>{
    const remote = q.docs.map(d=>clone(d.data()));
    if(first && !q.metadata.fromCache){
      first = false;
      /* allenamenti salvati sul dispositivo prima del collegamento: li carico sul tuo account */
      const ids = new Set(remote.map(w=>w.id));
      const missing = localW.filter(w=>w && w.id && !ids.has(w.id) && !store.get('up-'+w.id,false));
      missing.forEach(w=>{ store.set('up-'+w.id,true); remote.push(w); serial('w'+w.id,()=>wcol().doc(w.id).set(w)); });
      remote.sort((a,b)=>b.at-a.at);
    }
    S.workouts = remote; store.set('workouts',S.workouts);
    if(!q.metadata.fromCache) confirmed('w'); refresh();
  }, fail);
}

  hist.forEach(h=>{ let v=0; h.sets.forEach(s=>{ const kg=+s.kg||0, rp=+s.reps||0;
    if(kg>r.kg||(kg===r.kg&&rp>r.kgReps)){r.kg=kg;r.kgReps=rp}
    r.best=Math.max(r.best,e1rm(kg,rp)); r.reps=Math.max(r.reps,rp); v+=kg*rp; }); r.vol=Math.max(r.vol,v); });
  return r;
}

/* --- animazione dimostrativa con respiro --- */
let animRAF = null, animCtl = null;
function stopAnim(){ if(animRAF){ cancelAnimationFrame(animRAF); animRAF=null; } }
const reduceMotion = (()=>{ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } })();
function animColors(g){
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  return {fg:v('--fg'), far:v('--far'), machine:v('--machine'), accent:v(GROUPS[g].color.slice(4,-1)), line:v('--line'), bg:v('--sunk')};
}
function makeAnim(x, cv, word, sub){
  const A = ANIM[x.id]; const ctx = cv.getContext('2d');
  cv.width = 640; cv.height = 400; ctx.setTransform(2,0,0,2,0,0);
  const col = animColors(x.g), first = A ? A.ab : 'out';
  const d1 = (first==='out'?x.tempo[1]:x.tempo[0])*1000, d2 = (first==='out'?x.tempo[0]:x.tempo[1])*1000;
  const ease = u => u<.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2;
  let playing=false, t0=0, offset=0, lastPhase=-1;
  const label = ph => { const out = ph===0 ? first==='out' : first!=='out';
    if(word){ word.textContent = out?'Espira':'Inspira'; word.className = out?'out':'in'; }
    if(sub) sub.textContent = out ? x.br.out : x.br.in;
    if(AU.breath && cv.id==='demo' && playing) say(out?'Espira':'Inspira', true); };
  const frame = now => { const el=(now-t0+offset)%(d1+d2); let t, ph;
    if(el<d1){ ph=0; t=ease(el/d1); } else { ph=1; t=1-ease((el-d1)/d2); }
    const left = ph===0 ? (d1-el)/1000 : (d1+d2-el)/1000;
    drawScene(ctx, x.id, t, col, {dir: ph===0?1:-1, count: Math.ceil(left)}); if(ph!==lastPhase){ label(ph); lastPhase=ph; }
    animRAF = requestAnimationFrame(frame); };
  drawScene(ctx, x.id, 0, col);
  return {
    play(){ if(playing) return; stopAnim(); playing=true; t0=performance.now(); lastPhase=-1; animRAF=requestAnimationFrame(frame); },
    pause(){ if(!playing) return; playing=false; stopAnim(); offset += performance.now()-t0; },
    get playing(){ return playing; }
  };
}
function pacerHTML(x){
  return `<div class="player" id="player">
    <div class="ptop"><span class="tempo">${x.tempo[0]}" ritorno · ${x.tempo[1]}" sforzo</span>
    <button class="btn small" id="pacerBtn" type="button">▶ Avvia</button></div>
    <canvas class="demo" id="demo" role="img" aria-label="Animazione di come si esegue ${esc(x.name)}"></canvas>
    <div class="label"><b id="pacerWord">Come si fa</b><span id="pacerSub">Guarda il movimento e respira insieme all'omino</span></div>
  </div>`;
}
function bindPacer(x){
  const btn = document.getElementById('pacerBtn');
  animCtl = makeAnim(x, document.getElementById('demo'), document.getElementById('pacerWord'), document.getElementById('pacerSub'));
  const sync = ()=>{ btn.textContent = animCtl.playing ? '❚❚ Pausa' : '▶ Avvia'; };

  if(!reduceMotion){ animCtl.play(); sync(); }
}

const vdb = {

  async get(k){ try{ const d=await this.open(); return await new Promise(res=>{ const q=d.transaction('v').objectStore('v').get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); }catch(e){ return null; } },
  async set(k,v){ const d=await this.open(); return new Promise((res,rej)=>{ const t=d.transaction('v','readwrite'); t.objectStore('v').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); },
  async del(k){ try{ const d=await this.open(); await new Promise(res=>{ const t=d.transaction('v','readwrite'); t.objectStore('v').delete(k); t.oncomplete=res; t.onerror=res; }); }catch(e){} }

function chartSVG(hist, color){
  return lineChart(hist.map(h=>({at:h.at, v:Math.max(...h.sets.map(s=>e1rm(+s.kg||0,+s.reps||0)))})).filter(p=>p.v>0), color,
    'Massimale stimato nel tempo', 'Il grafico compare dopo almeno due allenamenti con questo esercizio.');
}
function lineChart(pts, color, aria, emptyMsg){
  if(pts.length<2) return `<p class="note">${esc(emptyMsg)}</p>`;
  const W=320,H=150,L=38,R=10,T=12,B=24;
  let lo=Math.min(...pts.map(p=>p.v)), hi=Math.max(...pts.map(p=>p.v));
  if(hi-lo<1){hi+=1;lo=Math.max(0,lo-1)}
  const pad=(hi-lo)*.15; lo=Math.max(0,lo-pad); hi=hi+pad;
  const X=i=>L+(W-L-R)*(i/(pts.length-1)), Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const area=line+` L${X(pts.length-1).toFixed(1)},${H-B} L${L},${H-B} Z`;
  const last=pts[pts.length-1], grid=[lo,(lo+hi)/2,hi];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">
    ${grid.map(g=>`<line x1="${L}" x2="${W-R}" y1="${Y(g).toFixed(1)}" y2="${Y(g).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${(Y(g)+4).toFixed(1)}" text-anchor="end">${hi-lo<10?kgf(g):Math.round(g)}</text>`).join('')}
    <path d="${area}" fill="${color}" opacity=".14"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===pts.length-1?5:2.5}" fill="${color}"/>`).join('')}
    <text x="${L}" y="${H-6}">${dshort.format(new Date(pts[0].at))}</text>
    <text x="${W-R}" y="${H-6}" text-anchor="end">${dshort.format(new Date(last.at))}</text>
  </svg>`;
}

function startRun(id){

  if(run && run.id!==id){
    backBar('Sessioni','#sessioni'); setTab('sessioni');

    document.getElementById('swap').onclick=()=>{ endRun(true); startRun(id); };
    return;
  }
  if(!run){
    run = {id, name:s.name, plan:s.items.map(i=>({ex:i[0], sets:+i[1]||1, reps:String(i[2]), rest:+i[3]||0})), i:0, set:1, restEnd:0, start:Date.now(), sets:[]};

function defaults(p, setNo){
  const here = run.sets.filter(s=>s.ex===p.ex);
  if(here.length) return {kg:here[here.length-1].kg, reps:here[here.length-1].reps};
  const h = histFor(p.ex); const last = h[h.length-1];
  if(last){ const s = last.sets[setNo-1] || last.sets[last.sets.length-1]; return {kg:s.kg, reps:s.reps}; }
  return {kg:'', reps:parseInt(p.reps,10)||''};
}

      </div>`}
      <div class="remind"><span><b>Inspira</b> ${esc(x.br.in.toLowerCase())} <b>Espira</b> ${esc(x.br.out.toLowerCase())}</span></div>

      <div class="minor"><button class="btn ghost small" type="button" id="addSet">+ Serie</button><button class="btn ghost small" type="button" id="skipEx">Salta esercizio</button><a class="btn ghost small" href="#ex-${x.id}">Come si fa</a></div>

    <div class="chips wrapchips qa" role="group" aria-label="Audio">${canSpeak?`<button class="chip" type="button" id="qVoice" aria-pressed="${AU.voice}">${AU.voice?'🔊 Voce':'🔇 Voce'}</button>`:''}${music.list.length?`<button class="chip" type="button" id="qMusic" aria-pressed="${!!(music.el&&!music.el.paused)}">${music.el&&!music.el.paused?'❚❚ Musica':'▶ Musica'}</button>`:''}<a class="chip" href="https://open.spotify.com/" target="_blank" rel="noopener">Apri Spotify</a></div>
    <div class="confirm" id="endWrap" style="margin-top:8px"><button class="btn ghost small" type="button" id="endRun">Termina allenamento</button></div>
  </section>`;
  if(resting){

    let lastSec = Math.ceil((run.restEnd-Date.now())/1000);
    tick = setInterval(()=>{ const left=(run.restEnd-Date.now())/1000, sec=Math.ceil(left); paintRest();
      if(sec!==lastSec){ if(sec===10 && (run.restTotal||0)>=25000) say('Ancora 10 secondi.'); if(sec>=1 && sec<=3) beep('tick'); lastSec=sec; }
      if(left<=0){ clearInterval(tick); beep('go'); run.restEnd=0; saveRun(); if(location.hash==='#allena-'+run.id) drawRun(); } },200);
    document.getElementById('skip').onclick = ()=>{ run.restEnd=0; saveRun(); drawRun(); };
    document.getElementById('plus').onclick = ()=>{ run.restEnd+=15000; run.restTotal=(run.restTotal||0)+15000; saveRun(); paintRest(); };
    document.getElementById('minus').onclick = ()=>{ run.restEnd-=15000; saveRun(); paintRest(); };
  } else {
    $app.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{
      const inp = document.getElementById(b.dataset.step==='kg'?'kgIn':'repsIn');
      const cur = parseFloat(String(inp.value).replace(',','.'))||0;
      const nv = Math.max(0, cur + parseFloat(b.dataset.d));
      inp.value = b.dataset.step==='kg' ? kgf(nv) : Math.round(nv);
    });
    const d2 = document.getElementById('demo2'); if(d2){ animCtl = makeAnim(x, d2, document.getElementById('w2'), null); if(!reduceMotion) animCtl.play(); }
    document.getElementById('addSet').onclick = ()=>{ p.sets++; saveRun(); drawRun(); };
    document.getElementById('skipEx').onclick = ()=>{ if(run.i>=run.plan.length-1) return finish(); run.i++; run.set=1; saveRun(); drawRun(); };
    document.getElementById('doneSet').onclick = ()=>{
      let rec = {ex:p.ex};
      if(!timeEx){
        const kg = parseFloat(document.getElementById('kgIn').value.replace(',','.'));
        const reps = parseInt(document.getElementById('repsIn').value,10);
        if(!(reps>0)){ const e=document.getElementById('err'); e.textContent='Scrivi quante ripetizioni hai fatto.'; e.hidden=false; return; }
        rec.kg = kg>0 ? Math.round(kg*100)/100 : 0; rec.reps = reps;
      } else rec.done = true;
      run.sets.push(rec);
      const lastOfAll = run.set>=p.sets && run.i>=run.plan.length-1;
      if(lastOfAll) return finish();
      if(run.set<p.sets) run.set++; else { run.i++; run.set=1; }

function ringOff(){ const tot=run.restTotal||1, left=Math.max(0,run.restEnd-Date.now()); return (565.5*(1-Math.min(1,left/tot))).toFixed(1); }
function paintRest(){ const c=document.getElementById('clock'), a=document.getElementById('arc'); if(c) c.textContent=fmt((run.restEnd-Date.now())/1000); if(a) a.setAttribute('stroke-dashoffset',ringOff()); }
function endRun(){ clearInterval(tick); run=null; saveRun(); try{wake&&wake.release()}catch(e){} wake=null; }
function finish(){
  clearInterval(tick);
  const before = {}; [...new Set(run.sets.map(s=>s.ex))].forEach(ex=>before[ex]=recordsOf(histFor(ex)));
  const end = Date.now(), mins = Math.max(1,Math.round((end-run.start)/60000));
  const vol = run.sets.reduce((a,s)=>a+(+s.kg||0)*(+s.reps||0),0);
  const w = {id:'w'+end.toString(36), sid:run.id, name:run.name, at:run.start, end, min:mins, vol:Math.round(vol), sets:run.sets};
  addWorkout(w);
  const prs = [];
  Object.keys(before).forEach(ex=>{ if(isTime(EXMAP[ex])) return; const b=before[ex], a=recordsOf(histFor(ex));
    if(!b.kg && !b.reps) return;
    if(a.kg>b.kg) prs.push([EXMAP[ex].name,`peso massimo ${kgf(a.kg)} kg`]);
    else if(a.best>b.best+0.05) prs.push([EXMAP[ex].name,`massimale stimato ${kgf(a.best)} kg`]);
    else if(a.vol>b.vol) prs.push([EXMAP[ex].name,`volume ${kgf(a.vol)} kg`]);
  });
  const name = run.name, nsets = run.sets.length;
  endRun(); view='done'; lastSaid='';
  beep('done'); say('Allenamento completato. '+nsets+' serie in '+mins+' minuti. Ottimo lavoro!');
  try{ history.replaceState(null,'','#fatto'); }catch(e){}
  backBar('Sessioni','#sessioni');
  $app.innerHTML = `<section class="rest" style="margin-top:24px"><div class="eyebrow">Fatto</div>
    <h2 style="font-size:30px;text-transform:uppercase">${esc(name)} completata</h2>
    <div class="stats"><div><b>${mins}'</b><span>Durata</span></div><div><b>${nsets}</b><span>Serie</span></div><div><b>${kgf(vol)}</b><span>Kg sollevati</span></div></div>
    ${prs.length?`<div class="prs"><div class="eyebrow">Nuovi record</div>${prs.map(p=>`<div><b>${esc(p[0])}</b><span>${esc(p[1])}</span></div>`).join('')}</div>`:''}
    <p class="next">Salvata nel diario. Bevi acqua e fai qualche minuto di allungamento.</p>
    <div class="links"><a class="btn" href="#diario">Vai al diario</a><a class="btn ghost" href="#sessioni">Altre sessioni</a></div></section>`;
}

const AU = Object.assign({beep:true, voice:true, breath:false, shuffle:false}, store.get('audio',{}));
const saveAU = ()=>store.set('audio',AU);
let actx = null;
function ac(){ try{ if(!actx){ const A=window.AudioContext||window.webkitAudioContext; if(A) actx=new A(); } if(actx && actx.state==='suspended') actx.resume(); }catch(e){} return actx; }
document.addEventListener('pointerdown', ()=>ac(), {capture:true});
function tone(freq, dur, when, vol){ const c=ac(); if(!c) return; const t=c.currentTime+(when||0), o=c.createOscillator(), g=c.createGain();
  o.type='sine'; o.frequency.value=freq; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.25,t+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05); }
function beep(kind){
  if(AU.beep){ try{
    if(kind==='tick') tone(660,.12);
    else if(kind==='done'){ tone(660,.16); tone(880,.16,.18); tone(1175,.4,.36); }
    else { tone(880,.18); tone(1175,.45,.2); }
  }catch(e){} }
  try{ navigator.vibrate && navigator.vibrate(kind==='tick'?40 : kind==='done'?[150,80,150,80,300] : [200,100,300]); }catch(e){}
}
const canSpeak = 'speechSynthesis' in window;
let itVoice = null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); itVoice = vs.find(v=>/^it/i.test(v.lang)&&v.localService) || vs.find(v=>/^it/i.test(v.lang)) || null; }catch(e){} }
if(canSpeak){ pickVoice(); try{ speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){} }
function say(text, force){
  if(!canSpeak || !(AU.voice || force)) return;
  try{ speechSynthesis.cancel(); duck(true);
    const parts = String(text).split(/(?<=[.;!?])\s+/).filter(Boolean);
    parts.forEach((t,k)=>{ const u=new SpeechSynthesisUtterance(t); u.lang='it-IT'; if(itVoice) u.voice=itVoice; u.rate=1.02;
      if(k===parts.length-1) u.onend=()=>duck(false); u.onerror=()=>duck(false); speechSynthesis.speak(u); });
  }catch(e){}
}
const spokenReps = r => String(r).replace(/(\d+)\s*–\s*(\d+)/g,'da $1 a $2').replace(/(\d+)"/g,'$1 secondi').replace(/(\d+)'/g,'$1 minuti');
const spokenRest = s => s<60 ? s+' secondi' : (s%60 ? Math.floor(s/60)+' minuti e '+(s%60)+' secondi' : (s/60===1?'un minuto':(s/60)+' minuti'));

const mdb = {
  open(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open('pf-music',1); r.onupgradeneeded=()=>r.result.createObjectStore('m'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); },
  async get(k){ try{ const d=await this.open(); return await new Promise(res=>{ const q=d.transaction('m').objectStore('m').get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); }catch(e){ return null; } },
  async set(k,v){ const d=await this.open(); return new Promise((res,rej)=>{ const t=d.transaction('m','readwrite'); t.objectStore('m').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); },
  async del(k){ try{ const d=await this.open(); await new Promise(res=>{ const t=d.transaction('m','readwrite'); t.objectStore('m').delete(k); t.oncomplete=res; t.onerror=res; }); }catch(e){} }
};

const saveSongs = ()=>store.set('songs', music.list);
const VOL = 1, DUCK = .3;
function mEl(){ if(!music.el){ const a=new Audio(); a.preload='auto'; a.onended=()=>mNext(); a.onplay=a.onpause=()=>paintMbar(); music.el=a; } return music.el; }
async function mLoad(i){ const s=music.list[i]; if(!s) return false; const blob=await mdb.get(s.id); if(!blob) return false;
  if(music.url) URL.revokeObjectURL(music.url); music.url=URL.createObjectURL(blob); const a=mEl(); a.src=music.url; music.i=i; music.loaded=true;
  try{ if('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({title:s.name, artist:'Palestra Facile', artwork:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}]}); }catch(e){}
  return true; }
async function mPlay(i){ if(!music.list.length) return; if(i!=null || !music.loaded){ if(!(await mLoad(i!=null?i:Math.min(music.i,music.list.length-1)))) return; }
  const a=mEl(); a.volume=VOL; try{ await a.play(); }catch(e){} paintMbar(); }
function mPause(){ if(music.el) music.el.pause(); paintMbar(); }
function mToggle(){ (!music.el || music.el.paused) ? mPlay() : mPause(); }
function mNext(){ const n=music.list.length; if(!n) return; mPlay(AU.shuffle && n>1 ? (music.i+1+Math.floor(Math.random()*(n-1)))%n : (music.i+1)%n); }
function mStop(){ if(music.el){ music.el.pause(); music.el.removeAttribute('src'); music.el.load(); } if(music.url){ URL.revokeObjectURL(music.url); music.url=null; } music.loaded=false; paintMbar(); }
function duck(on){ if(music.el && !music.el.paused) music.el.volume = on ? VOL*DUCK : VOL; }
try{ if('mediaSession' in navigator){ navigator.mediaSession.setActionHandler('play',()=>mPlay()); navigator.mediaSession.setActionHandler('pause',mPause); navigator.mediaSession.setActionHandler('nexttrack',mNext); } }catch(e){}
const mbar = document.createElement('div'); mbar.className='mbar'; mbar.hidden=true; document.body.appendChild(mbar);
function paintMbar(){
  const on = music.loaded && music.list[music.i];
  mbar.hidden = !on; document.body.classList.toggle('has-mbar', !!on);
  if(!on) return;
  const nav=document.querySelector('nav.tabs'); mbar.style.bottom = (nav?nav.offsetHeight:0)+'px';
  const playing = music.el && !music.el.paused;
  mbar.innerHTML = `<div class="wrap"><button type="button" class="mb-play" aria-label="${playing?'Pausa':'Riproduci'}">${playing?'❚❚':'▶'}</button>
    <span class="mb-name"><small>${playing?'In riproduzione':'In pausa'}</small>${esc(music.list[music.i].name)}</span>
    <button type="button" class="mb-btn" data-mb="next" aria-label="Canzone successiva">⏭</button><button type="button" class="mb-btn" data-mb="stop" aria-label="Chiudi la musica">✕</button></div>`;
  mbar.querySelector('.mb-play').onclick = mToggle;
  mbar.querySelector('[data-mb="next"]').onclick = mNext;
  mbar.querySelector('[data-mb="stop"]').onclick = mStop;
  const q=document.getElementById('qMusic'); if(q){ q.setAttribute('aria-pressed', String(playing)); q.textContent = playing ? '❚❚ Musica' : '▶ Musica'; }
}
addEventListener('resize', ()=>{ if(!mbar.hidden) paintMbar(); });

      <div class="chips"><button class="chip" type="button" data-au="shuffle" aria-pressed="${!!AU.shuffle}">${AU.shuffle?'✓ ':''}Ordine casuale</button></div>` : ''}
    <div class="links"><label class="btn ghost small upl" for="songFile">＋ Aggiungi canzoni</label><input id="songFile" type="file" accept="audio/*" multiple hidden>
      <a class="btn ghost small" href="https://open.spotify.com/" target="_blank" rel="noopener">Apri Spotify</a></div>
    <p class="note" id="songMsg" aria-live="polite">${music.list.length?'':'Scegli dei file musicali dal telefono (mp3 e simili): restano salvati qui e si sentono anche senza internet. '}Se usi Spotify, avvialo prima: la musica continua sotto e la voce dell'app si sente sopra.</p>
  </section>`;
}
function bindAudioCard(redraw){
  const card=document.getElementById('audioCard'); if(!card) return;
  card.querySelectorAll('[data-au]').forEach(b=>b.onclick=()=>{ const k=b.dataset.au; AU[k]=!AU[k]; saveAU(); if(k==='beep'&&AU.beep) beep('go'); if(k==='voice'&&AU.voice) say('Voce guida attiva.'); keepScroll(redraw); });
  const t=document.getElementById('auTest'); if(t) t.onclick=()=>say('Ciao! Serie 1 di 3, Leg Press, 10 ripetizioni. Inspira mentre scendi, espira mentre spingi.', true);
  card.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>mPlay(+b.dataset.sp));
  card.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.sd, row=card.querySelector(`[data-sw="${id}"]`);
    row.innerHTML='<span>Togliere questa canzone?</span><button class="btn small" type="button" data-y>Sì</button><button class="btn ghost small" type="button" data-n>No</button>';
    row.querySelector('[data-n]').onclick=()=>keepScroll(redraw);
    row.querySelector('[data-y]').onclick=async ()=>{ const k=music.list.findIndex(s=>s.id===id);
      if(k===music.i && music.loaded) mStop(); else if(k>=0 && k<music.i) music.i--;
      music.list=music.list.filter(s=>s.id!==id); saveSongs(); await mdb.del(id); keepScroll(redraw); };
  });
  document.getElementById('songFile').onchange = async e=>{
    const files=[...(e.target.files||[])]; if(!files.length) return;
    const msg=document.getElementById('songMsg'); let ok=0, bad=0;
    for(const f of files){ msg.textContent=`Salvo ${f.name}…`;
      try{ const id='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); await mdb.set(id,f); music.list.push({id, name:f.name.replace(/\.[^.]+$/,'')}); ok++; }catch(err){ bad++; } }
    saveSongs(); keepScroll(redraw);
    const m2=document.getElementById('songMsg'); if(m2) m2.textContent = bad ? `Salvate ${ok} canzoni. ${bad} non si sono salvate: forse il telefono è pieno.` : `Salvate ${ok} ${ok===1?'canzone':'canzoni'}. Premi ▶ per ascoltare.`;
  };
}

/* ---------------- DIARIO ---------------- */
function viewDiary(){
  view='diary'; brand(); setTab('diario');
  const log = S.workouts;
  const now = new Date(); const dow = (now.getDay()+6)%7; const monday = new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow).getTime();
  const days = ['L','M','M','G','V','S','D'].map((l,k)=>{
    const d0 = new Date(monday); d0.setDate(d0.getDate()+k); const t0=d0.getTime(); const d1=new Date(t0); d1.setDate(d1.getDate()+1);
    return {l, on: log.some(e=>e.at>=t0&&e.at<d1.getTime()), today:k===dow};
  });
  const thisWeek = log.filter(w=>w.at>=monday);
  const wVol = thisWeek.reduce((a,w)=>a+(w.vol||0),0), wSets = thisWeek.reduce((a,w)=>a+((w.sets||[]).length),0);
  $app.innerHTML = `<section class="view">
    <div><div class="eyebrow">Questa settimana</div><h1 style="font-size:40px;text-transform:uppercase">${thisWeek.length} ${thisWeek.length===1?'allenamento':'allenamenti'}</h1></div>
    ${runBanner()}
    <div class="week">${days.map(d=>`<div><i class="${d.on?'on':''} ${d.today?'today':''}"></i>${d.l}</div>`).join('')}</div>
    <div class="stats"><div><b>${wSets}</b><span>Serie</span></div><div><b>${kgf(wVol)}</b><span>Kg sollevati</span></div><div><b>${log.length}</b><span>Totale sessioni</span></div></div>
    <h2 style="font-size:22px;text-transform:uppercase;margin-top:8px">Storico</h2>
    ${log.length ? `<div class="log2">${log.slice(0,60).map(w=>{
      const by={}; (w.sets||[]).forEach(s=>{(by[s.ex]=by[s.ex]||[]).push(s)});
      return `<details class="w"><summary><b>${esc(w.name)}</b><span>${df.format(new Date(w.at))} · ${w.min} min</span></summary>
        <div class="body">${Object.keys(by).map(ex=>{ const x=EXMAP[ex]; if(!x) return ''; return `<p><b>${esc(x.name)}</b>: ${isTime(x)?by[ex].length+(by[ex].length===1?' volta':' serie'):by[ex].map(s=>`${kgf(+s.kg||0)}×${s.reps}`).join(', ')}</p>`}).join('') || '<p>Nessun dettaglio delle serie.</p>'}
          ${w.vol?`<p class="note">Volume: ${kgf(w.vol)} kg</p>`:''}
          <div class="confirm" data-delwrap="${w.id}"><button class="btn ghost small" type="button" data-del="${w.id}">Elimina</button></div></div></details>`}).join('')}</div>`
      : `<div class="empty">Qui compariranno le sessioni completate.<br><a href="#sessioni">Scegli una sessione e premi Inizia</a> per registrare la prima.</div>`}
    <p class="fine">${DB?'I dati sono salvati sul tuo account: li ritrovi anche da un altro dispositivo aprendo questa app.':'Aperta fuori da Claude, l\'app salva i dati solo su questo dispositivo.'}</p>
  </section>`;
  $app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.del, wrap=$app.querySelector(`[data-delwrap="${id}"]`);
    wrap.innerHTML='<span>Eliminare questo allenamento?</span><button class="btn small" type="button" data-yes>Sì, elimina</button><button class="btn ghost small" type="button" data-no>Annulla</button>';
    wrap.querySelector('[data-yes]').onclick=()=>{ deleteWorkout(id); keepScroll(viewDiary); };
    wrap.querySelector('[data-no]').onclick=()=>keepScroll(viewDiary);
  });
}

/* ---------------- CORPO ---------------- */
const MEAS = [['weight','Peso','kg'],['waist','Vita','cm'],['hips','Fianchi','cm'],['chest','Petto','cm'],['arm','Braccio','cm'],['thigh','Coscia','cm'],['fat','Massa grassa','%']];
let bodyMetric = 'weight';
function saveBody(){ store.set('body',S.body); if(DB){ const b=clone(S.body); serial('body',()=>DB.doc(BASE+'/body').set(b)); } }
const num = v => { const n = parseFloat(String(v).replace(',','.')); return isFinite(n) && n>0 ? Math.round(n*10)/10 : null; };
const isoDay = d => { const z=new Date(d); return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0'); };
function viewBody(){
  view='body'; brand(); setTab('corpo');
  const E = (S.body.entries||[]).slice().sort((a,b)=>a.at-b.at);
  const lastOf = k => { for(let i=E.length-1;i>=0;i--) if(E[i][k]!=null) return E[i]; return null; };
  const lw = lastOf('weight'), fw = E.find(e=>e.weight!=null);
  const h = num(S.body.height), goal = num(S.body.goal), age = num(S.body.age);
  const bmi = lw && h ? lw.weight/((h/100)**2) : 0;
  const cat = !bmi ? '' : bmi<18.5 ? 'Sottopeso' : bmi<25 ? 'Normopeso' : bmi<30 ? 'Sovrappeso' : 'Obesità';
  const diff = lw && fw && lw!==fw ? lw.weight-fw.weight : null;
  const avail = MEAS.filter(m=>E.some(e=>e[m[0]]!=null));
  if(avail.length && !avail.some(m=>m[0]===bodyMetric)) bodyMetric = avail[0][0];
  const M = MEAS.find(m=>m[0]===bodyMetric);
  const pts = E.filter(e=>e[bodyMetric]!=null).map(e=>({at:e.at, v:e[bodyMetric]}));
  const sign = n => (n>0?'+':n<0?'−':'')+kgf(Math.abs(n));
  $app.innerHTML = `<section class="view">
    <div><div class="eyebrow">Il tuo corpo</div><h1 style="font-size:40px;text-transform:uppercase">Corpo</h1></div>
    <div class="stats">
      <div><b>${lw?kgf(lw.weight):'—'}</b><span>Peso kg</span></div>
      <div><b>${bmi?kgf(bmi):'—'}</b><span>${cat||'IMC'}</span></div>
      <div><b>${diff!=null?sign(diff):'—'}</b><span>Dall'inizio</span></div>
    </div>
    ${goal && lw ? `<p class="lead">Obiettivo ${kgf(goal)} kg: ${Math.abs(lw.weight-goal)<0.05?'<b>raggiunto!</b>':`mancano <b>${kgf(Math.abs(lw.weight-goal))} kg</b>`}.</p>` : ''}
    <section class="card"><h2>Nuova misurazione</h2>
      <form id="bForm" class="mgrid">
        <label class="wide">Data<input id="bDate" type="date" value="${isoDay(Date.now())}"></label>
        ${MEAS.map(m=>`<label>${m[1]} (${m[2]})<input id="m-${m[0]}" inputmode="decimal" placeholder="${(lastOf(m[0])||{})[m[0]]!=null?kgf(lastOf(m[0])[m[0]]):'—'}"></label>`).join('')}
        <p class="err wide" id="bErr" hidden></p>
        <button class="btn wide" type="submit">Salva misurazione</button>
      </form>
      <p class="note">Basta anche solo il peso. Per misure confrontabili, misurati la mattina, a digiuno, sempre nello stesso punto.</p>
    </section>
    <section class="card"><h2>Andamento</h2>
      ${avail.length ? `<div class="chips" role="group" aria-label="Misura">${avail.map(m=>`<button class="chip" type="button" data-m="${m[0]}" aria-pressed="${m[0]===bodyMetric}">${m[1]}</button>`).join('')}</div>
        <div class="eyebrow">${M[1]}, ${M[2]}</div>
        ${lineChart(pts, 'var(--blue)', M[1]+' nel tempo', 'Il grafico compare dopo almeno due misurazioni.')}`
      : '<p class="note">Salva la prima misurazione: qui vedrai i grafici di peso e misure nel tempo.</p>'}
    </section>
    <section class="card"><h2>Profilo</h2>
      <form id="pForm" class="mgrid">
        <label>Altezza (cm)<input id="pHeight" inputmode="decimal" value="${h?kgf(h):''}" placeholder="es. 175"></label>
        <label>Peso obiettivo (kg)<input id="pGoal" inputmode="decimal" value="${goal?kgf(goal):''}" placeholder="es. 72"></label>
        <label>Età<input id="pAge" inputmode="numeric" value="${age?Math.round(age):''}" placeholder="es. 30"></label>
        <button class="btn ghost wide" type="submit">Salva profilo</button>
      </form>
      <p class="note" id="pMsg">L'altezza serve per calcolare l'IMC (indice di massa corporea).</p>
    </section>
    ${E.length ? `<h2 style="font-size:22px;text-transform:uppercase">Storico misure</h2>
    <div class="log2">${E.slice().reverse().slice(0,40).map(e=>`<details class="w"><summary><b>${df.format(new Date(e.at))}</b><span>${e.weight!=null?kgf(e.weight)+' kg':''}</span></summary>
      <div class="body">${MEAS.filter(m=>e[m[0]]!=null).map(m=>`<p><b>${m[1]}</b>: ${kgf(e[m[0]])} ${m[2]}</p>`).join('')}
      <div class="confirm" data-bwrap="${e.id}"><button class="btn ghost small" type="button" data-bdel="${e.id}">Elimina</button></div></div></details>`).join('')}</div>` : ''}
    ${backupHTML()}
  </section>`;
  $app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ bodyMetric=b.dataset.m; keepScroll(viewBody); });
  document.getElementById('bForm').onsubmit = e=>{
    e.preventDefault();
    const vals = {}; MEAS.forEach(m=>{ const v=num(document.getElementById('m-'+m[0]).value); if(v!=null) vals[m[0]]=v; });
    const err = document.getElementById('bErr');
    if(!Object.keys(vals).length){ err.textContent='Scrivi almeno una misura, per esempio il peso.'; err.hidden=false; return; }
    if(vals.fat!=null && vals.fat>70){ err.textContent='La massa grassa va scritta in percentuale, per esempio 18.'; err.hidden=false; return; }
    const ds = document.getElementById('bDate').value; const day = ds ? new Date(ds+'T12:00:00').getTime() : Date.now();
    const same = (S.body.entries||[]).find(x=>isoDay(x.at)===isoDay(day));
    if(same) Object.assign(same, vals); else (S.body.entries=S.body.entries||[]).push(Object.assign({id:'b'+Date.now().toString(36), at:day}, vals));
    saveBody(); keepScroll(viewBody);
  };
  document.getElementById('pForm').onsubmit = e=>{
    e.preventDefault();
    S.body.height = num(document.getElementById('pHeight').value) || '';
    S.body.goal = num(document.getElementById('pGoal').value) || '';
    S.body.age = num(document.getElementById('pAge').value) || '';
    saveBody(); keepScroll(viewBody);
    const m=document.getElementById('pMsg'); if(m) m.textContent='Profilo salvato.';
  };
  $app.querySelectorAll('[data-bdel]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.bdel, wrap=$app.querySelector(`[data-bwrap="${id}"]`);
    wrap.innerHTML='<span>Eliminare questa misurazione?</span><button class="btn small" type="button" data-yes>Sì, elimina</button><button class="btn ghost small" type="button" data-no>Annulla</button>';
    wrap.querySelector('[data-yes]').onclick=()=>{ S.body.entries=S.body.entries.filter(x=>x.id!==id); saveBody(); keepScroll(viewBody); };
    wrap.querySelector('[data-no]').onclick=()=>keepScroll(viewBody);
  });
  bindBackup();
}

/* ---------------- BACKUP ---------------- */
function backupHTML(){
  return `<section class="card"><h2>Backup dei dati</h2>
    <p class="note">Copia il backup e incollalo in un posto sicuro (una nota o un messaggio a te stesso). Se cambi telefono, lo incolli qui sotto e ritrovi tutto. I video caricati non sono inclusi.</p>
    <div class="links"><button class="btn ghost small" type="button" id="bkCopy">Copia backup</button></div>
    <textarea id="bkText" rows="3" placeholder="Incolla qui un backup per ripristinarlo"></textarea>
    <div class="links"><button class="btn small" type="button" id="bkLoad">Ripristina dal backup</button></div>
    <p class="note" id="bkMsg" aria-live="polite"></p>
  </section>`;
}
function bindBackup(){
  const msg = t => { const m=document.getElementById('bkMsg'); if(m) m.textContent=t; };
  document.getElementById('bkCopy').onclick = ()=>{
    const txt = JSON.stringify({app:'palestra-facile', v:1, at:Date.now(), routines:S.routines, videos:S.videos, workouts:S.workouts, body:S.body});
    const ta = document.getElementById('bkText');
    const fallback = ()=>{ ta.value = txt; ta.focus(); ta.select(); msg('Il testo del backup è nel riquadro ed è selezionato: copialo a mano.'); };
    try{ navigator.clipboard.writeText(txt).then(()=>msg('Backup copiato. Incollalo in una nota per conservarlo.'), fallback); }catch(e){ fallback(); }
  };
  document.getElementById('bkLoad').onclick = ()=>{
    let d; try{ d = JSON.parse(document.getElementById('bkText').value.trim()); }catch(e){ d=null; }
    if(!d || d.app!=='palestra-facile'){ msg('Questo testo non è un backup di Palestra Facile. Incolla tutto il testo copiato.'); return; }
    let nw=0;
    const have = new Set(S.workouts.map(w=>w.id));
    (d.workouts||[]).forEach(w=>{ if(w && w.id && !have.has(w.id)){ addWorkout(w); nw++; } });
    S.workouts.sort((a,b)=>b.at-a.at); store.set('workouts',S.workouts);
    const rids = new Set(S.routines.map(r=>r.id)); (d.routines||[]).forEach(r=>{ if(r && r.id && !rids.has(r.id)) S.routines.push(r); }); saveRoutines();
    Object.assign(S.videos, d.videos||{}); saveVideos();
    if(d.body){ const ids=new Set((S.body.entries||[]).map(e=>e.id)); S.body.entries=(S.body.entries||[]).concat((d.body.entries||[]).filter(e=>e&&!ids.has(e.id)));
      ['height','goal','age'].forEach(k=>{ if(!S.body[k] && d.body[k]) S.body[k]=d.body[k]; }); saveBody(); }
    keepScroll(viewBody); const m=document.getElementById('bkMsg'); if(m) m.textContent = `Ripristino fatto: ${nw} allenamenti aggiunti.`;
  };
}

/* ---------------- NAVIGAZIONE ---------------- */
let explaining=false;
function route(soft){
  stopPacer(); stopAnim();
  if(explaining){ explaining=false; try{speechSynthesis.cancel()}catch(e){} }
  const h = (location.hash||'#esercizi').slice(1);
  if(!h.startsWith('allena-')) clearInterval(tick);
  const go = ()=>{
    if(h.startsWith('ex-')) return viewExercise(h.slice(3));
    if(h.startsWith('allena-')) return startRun(h.slice(7));
    if(h.startsWith('scheda-')) return viewEditor(h.slice(7));
    if(h==='sessioni') return viewSessions();
    if(h==='diario') return viewDiary();
    if(h==='corpo') return viewBody();
    viewList();
  };
  if(soft===true){ const open=[...document.querySelectorAll('details[open]')].map(d=>d.querySelector('[data-del]')?.dataset.del); keepScroll(go);
    open.forEach(id=>{ const b=id&&$app.querySelector(`[data-del="${id}"]`); if(b) b.closest('details').open=true; }); }
  else { go(); window.scrollTo(0,0); }
}
window.addEventListener('hashchange',()=>route());
route();
initDb();
